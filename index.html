<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Datenschutz: Nur eigene Ressourcen, keine Inline-Skripte/-Styles, keine fremden Verbindungen -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Maschenrechner: Strickprojekte planen, Anleitungen auf die eigene Maschenprobe umrechnen und Reihen zählen. Offline nutzbar, alle Daten bleiben auf dem Gerät.">
  <meta name="theme-color" content="#7a2e4a">
  <title>Maschenrechner</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <header class="kopf">
    <a class="kopf-knopf kopf-zurueck" id="kopf-zurueck" href="#/" data-text-aria-label="kopf.zurueck" aria-label="Zurück" hidden>
      <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-text="kopf.zurueck">Zurück</span>
    </a>
    <h1 id="kopf-titel" tabindex="-1">Maschenrechner</h1>
    <a class="kopf-knopf kopf-zahnrad" id="kopf-zahnrad" href="#/einstellungen" data-text-aria-label="kopf.einstellungen" aria-label="Einstellungen">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6a.5.5 0 0 0 .1-.6l-1.9-3.3a.5.5 0 0 0-.6-.2l-2.4 1a7.3 7.3 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-3.8a.5.5 0 0 0-.5.4l-.4 2.6a7.3 7.3 0 0 0-1.7 1l-2.4-1a.5.5 0 0 0-.6.2L2.5 8.8a.5.5 0 0 0 .1.6l2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6a.5.5 0 0 0-.1.6l1.9 3.3a.5.5 0 0 0 .6.2l2.4-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .2.3.4.5.4h3.8c.2 0 .5-.2.5-.4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.4 1a.5.5 0 0 0 .6-.2l1.9-3.3a.5.5 0 0 0-.1-.6zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
    </a>
  </header>

  <p class="hinweis hinweis-warnung" data-hinweis="speicher" role="status" hidden data-text="hinweis.speicherNichtVerfuegbar">Eingaben können auf diesem Gerät nicht gespeichert werden.</p>

  <p class="hinweis hinweis-erfolg" data-hinweis="meldung" role="status" hidden></p>

  <main id="ansicht" aria-live="off">
    <noscript><p class="hinweis">Der Maschenrechner braucht JavaScript.</p></noscript>
  </main>

  <!-- ===================================================== Vorlagen ===================================================== -->

  <!-- Projektliste (US-09) -->
  <template id="tpl-projektliste">
    <div class="ansicht ansicht-liste">
      <section class="karte leerzustand" data-rolle="leer" hidden>
        <h2 data-text="liste.leer.titel">Noch keine Projekte</h2>
        <p data-text="liste.leer.text">Lege dein erstes Strickprojekt an.</p>
      </section>
      <ul class="liste" data-rolle="liste"></ul>
      <button type="button" class="knopf knopf-primaer knopf-breit" data-rolle="neu" data-text="liste.neu">Neues Projekt</button>
    </div>
  </template>

  <!-- Projekt (US-09, US-10) -->
  <template id="tpl-projekt">
    <div class="ansicht ansicht-projekt">
      <div class="hinweis hinweis-neu" data-rolle="uebernommen" role="status" hidden>
        <p data-text="hinweis.uebernommen">Deine bisherigen Eingaben stehen jetzt in diesem Projekt.</p>
        <button type="button" class="knopf knopf-zweitrangig" data-rolle="verstanden" data-text="hinweis.verstanden">Verstanden</button>
      </div>

      <section class="karte" aria-labelledby="titel-stuecke">
        <h2 id="titel-stuecke" data-text="projekt.strickstuecke">Strickstücke</h2>
        <p class="beschreibung" data-rolle="keine-stuecke" data-text="projekt.keineStuecke" hidden>Noch keine Strickstücke.</p>
        <ul class="liste" data-rolle="stuecke"></ul>
        <button type="button" class="knopf knopf-primaer knopf-breit" data-rolle="stueck-neu" data-text="projekt.stueckNeu">Strickstück hinzufügen</button>
      </section>

      <section class="karte" aria-labelledby="titel-angaben">
        <h2 id="titel-angaben" data-text="projekt.angaben">Angaben</h2>
        <div class="feld">
          <label for="projekt-name" data-text="projekt.name">Name</label>
          <input id="projekt-name" type="text" autocomplete="off" maxlength="80" data-projektfeld="name" aria-describedby="fehler-projekt-name">
          <p class="fehler" id="fehler-projekt-name" hidden></p>
        </div>
        <div class="feld">
          <label for="projekt-beschreibung" data-text="projekt.beschreibung">Beschreibung (optional)</label>
          <textarea id="projekt-beschreibung" rows="2" maxlength="500" data-projektfeld="beschreibung"></textarea>
        </div>
        <div class="feld">
          <label for="projekt-garn" data-text="projekt.garn">Garn (optional)</label>
          <input id="projekt-garn" type="text" autocomplete="off" maxlength="80" data-projektfeld="garn">
        </div>
      </section>

      <section class="karte" aria-labelledby="titel-proben" id="proben">
        <h2 id="titel-proben" data-text="proben.titel">Maschenproben</h2>
        <div class="proben-liste" data-rolle="proben"></div>
        <button type="button" class="knopf knopf-zweitrangig knopf-breit" data-rolle="probe-neu" data-text="probe.hinzufuegen">Probe hinzufügen</button>
      </section>

      <button type="button" class="knopf knopf-gefahr-rand knopf-breit" data-rolle="loeschen" data-text="projekt.loeschen">Projekt löschen</button>
    </div>
  </template>

  <!-- Eine Probe des Projekts: Name, Nadel, Anleitungs- und eigene Probe (US-32) -->
  <template id="tpl-probenpaar">
    <section class="probenpaar">
      <h3 class="probenpaar-titel" data-rolle="titel">Probe</h3>
      <div class="probe-zeile">
        <div class="feld">
          <label data-rolle="l-name" data-text="probe.name">Name der Probe</label>
          <input type="text" autocomplete="off" maxlength="40" data-paarfeld="name">
          <p class="fehler" data-rolle="f-name" hidden></p>
        </div>
        <div class="feld">
          <label data-rolle="l-nadelstaerkeMm" data-text="probe.nadel">Nadelstärke in mm (optional)</label>
          <input type="text" inputmode="decimal" autocomplete="off" maxlength="12" data-paarfeld="nadelstaerkeMm" data-regel="nadel">
          <p class="fehler" data-rolle="f-nadelstaerkeMm" hidden></p>
        </div>
      </div>
      <div class="proben-raster" data-rolle="proben"></div>
      <button type="button" class="knopf knopf-gefahr-rand" data-rolle="probe-loeschen" data-text="probe.loeschen">Probe löschen</button>
    </section>
  </template>

  <!-- Eine Maschenprobe (je Probe zweimal: Anleitung und eigene) -->
  <template id="tpl-probe">
    <fieldset class="probe">
      <legend data-rolle="legende">Probe</legend>
      <div class="probe-zeile">
        <div class="feld">
          <label data-rolle="l-maschenAnzahl" data-text="proben.maschen">Maschen</label>
          <input type="text" inputmode="decimal" autocomplete="off" enterkeyhint="next" maxlength="12" data-probefeld="maschenAnzahl" data-regel="probenAnzahl">
          <p class="fehler" hidden></p>
        </div>
        <div class="feld">
          <label data-rolle="l-maschenBezug" data-text="proben.bezugBreite">auf Breite (cm)</label>
          <input type="text" inputmode="decimal" autocomplete="off" enterkeyhint="next" maxlength="12" data-probefeld="maschenBezug" data-regel="bezugsmass">
          <p class="fehler" hidden></p>
        </div>
      </div>
      <p class="dichte"><span data-text="proben.dichteMaschen">Maschen pro cm</span> <output data-rolle="dichteMaschen">–</output></p>
      <div class="probe-zeile">
        <div class="feld">
          <label data-rolle="l-reihenAnzahl" data-text="proben.reihen">Reihen</label>
          <input type="text" inputmode="decimal" autocomplete="off" enterkeyhint="next" maxlength="12" data-probefeld="reihenAnzahl" data-regel="probenAnzahl">
          <p class="fehler" hidden></p>
        </div>
        <div class="feld">
          <label data-rolle="l-reihenBezug" data-text="proben.bezugHoehe">auf Höhe (cm)</label>
          <input type="text" inputmode="decimal" autocomplete="off" enterkeyhint="next" maxlength="12" data-probefeld="reihenBezug" data-regel="bezugsmass">
          <p class="fehler" hidden></p>
        </div>
      </div>
      <p class="dichte"><span data-text="proben.dichteReihen">Reihen pro cm</span> <output data-rolle="dichteReihen">–</output></p>
    </fieldset>
  </template>

  <!-- Strickstück (US-10) -->
  <template id="tpl-strickstueck">
    <div class="ansicht ansicht-stueck">
      <a class="knopf knopf-primaer knopf-breit knopf-zaehlen" data-rolle="zaehlen" href="#/">
        <span data-text="stueck.zaehlen">Reihen zählen</span>
        <span class="zaehlen-stand" data-rolle="stand">Reihe 0</span>
      </a>

      <section class="karte proben-kurz" aria-labelledby="titel-proben-kurz">
        <h2 id="titel-proben-kurz" data-rolle="probe-titel">Probe</h2>
        <p data-rolle="probe-nadel" hidden></p>
        <p data-rolle="probe-anleitung">–</p>
        <p data-rolle="probe-eigen">–</p>
        <div class="knopf-reihe">
          <button type="button" class="knopf knopf-zweitrangig" data-rolle="probe-wechseln" data-text="stueck.probeWechseln" hidden>Probe wechseln</button>
          <a class="link" data-rolle="proben-link" href="#/" data-text="stueck.probenAendern">Proben ändern</a>
        </div>
      </section>

      <div class="rechner-raster" data-rolle="rechner"></div>

      <div data-rolle="plan"></div>

      <div class="knopf-reihe">
        <button type="button" class="knopf knopf-zweitrangig" data-rolle="umbenennen" data-text="stueck.umbenennen">Umbenennen</button>
        <button type="button" class="knopf knopf-zweitrangig" data-rolle="zuruecksetzen" data-text="stueck.zuruecksetzen">Eingaben zurücksetzen</button>
        <button type="button" class="knopf knopf-gefahr-rand" data-rolle="loeschen" data-text="stueck.loeschen">Strickstück löschen</button>
      </div>
    </div>
  </template>

  <!-- Eine Rechner-Karte (viermal je Strickstück; Logik aus Sprint 1) -->
  <template id="tpl-rechner">
    <section class="karte rechner">
      <h2 data-rolle="titel">Rechner</h2>
      <p class="beschreibung" data-rolle="beschreibung"></p>

      <div class="feld">
        <label data-rolle="eingabe-label">Eingabe</label>
        <input type="text" autocomplete="off" enterkeyhint="next" maxlength="12" data-rolle="eingabe">
        <p class="fehler" data-rolle="eingabe-fehler" hidden></p>
      </div>

      <dl class="werte">
        <div data-nur="anleitung"><dt data-rolle="t-massAnleitung"></dt><dd data-ergebnis="massAnleitung">–</dd></div>
        <div data-nur="laenge"><dt data-rolle="t-anleitungGerundet"></dt><dd data-ergebnis="anleitungGerundet">–</dd></div>
        <div><dt data-rolle="t-eigenGerundet"></dt><dd data-ergebnis="eigenGerundet">–</dd></div>
      </dl>

      <div class="feld anpassung">
        <label data-rolle="anpassung-label" data-text="anpassung.label">Anpassung</label>
        <div class="stepper">
          <button type="button" class="stepper-knopf" data-schritt="-1" data-text-aria-label="anpassung.minus" aria-label="Anpassung um 1 verringern">−</button>
          <input type="text" inputmode="numeric" autocomplete="off" enterkeyhint="next" maxlength="6" data-rolle="anpassung">
          <button type="button" class="stepper-knopf" data-schritt="1" data-text-aria-label="anpassung.plus" aria-label="Anpassung um 1 erhöhen">+</button>
        </div>
        <p class="feldhinweis" data-rolle="anpassung-hinweis" data-text="anpassung.hinweis">Ganze Zahl, z. B. +1 oder −2</p>
        <p class="fehler" data-rolle="anpassung-fehler" hidden></p>
      </div>

      <div class="ergebnis">
        <p class="hauptergebnis"><span data-rolle="t-endgueltig"></span> <output aria-live="polite" data-ergebnis="endgueltig">–</output></p>
        <dl class="werte">
          <div><dt data-rolle="t-tatsaechlich"></dt><dd data-ergebnis="tatsaechlich">–</dd></div>
          <div><dt data-rolle="t-abweichung"></dt><dd data-ergebnis="abweichung">–</dd></div>
        </dl>
        <div class="hinweis" data-rolle="status" hidden>
          <p data-rolle="status-text"></p>
          <a class="link" data-rolle="status-link" href="#/" data-text="hinweis.probenLink" hidden>Zu den Maschenproben</a>
        </div>
      </div>
    </section>
  </template>

  <!-- Zu- und Abnahmen eines Strickstücks (US-13, US-14, US-16) -->
  <template id="tpl-plankarte">
    <section class="karte plan" aria-labelledby="titel-plan">
      <h2 id="titel-plan" data-text="plan.titel">Zu- und Abnahmen</h2>
      <div data-rolle="ohne-plan">
        <p class="beschreibung" data-text="plan.leer">Für Teile, deren Breite sich ändert.</p>
        <button type="button" class="knopf knopf-primaer knopf-breit" data-rolle="anlegen" data-text="plan.anlegen">Plan anlegen</button>
      </div>
      <div class="plan-inhalt" data-rolle="mit-plan" hidden>
        <p class="feldhinweis" data-text="plan.richtungHinweis">In Strickrichtung: Anfang ist dort, wo du anschlägst.</p>
        <div class="plan-felder">
          <div class="feld">
            <label for="plan-anfangBreite" data-text="plan.anfangBreite">Breite am Anfang</label>
            <input id="plan-anfangBreite" type="text" inputmode="decimal" autocomplete="off" maxlength="12" data-planfeld="anfangBreite" data-regel="laenge" aria-describedby="fehler-plan-anfangBreite">
            <p class="fehler" id="fehler-plan-anfangBreite" hidden></p>
          </div>
          <div class="feld">
            <label for="plan-endBreite" data-text="plan.endBreite">Breite am Ende</label>
            <input id="plan-endBreite" type="text" inputmode="decimal" autocomplete="off" maxlength="12" data-planfeld="endBreite" data-regel="laenge" aria-describedby="fehler-plan-endBreite">
            <p class="fehler" id="fehler-plan-endBreite" hidden></p>
          </div>
          <div class="feld">
            <label for="plan-laenge" data-text="plan.laenge">Länge</label>
            <input id="plan-laenge" type="text" inputmode="decimal" autocomplete="off" maxlength="12" data-planfeld="laenge" data-regel="laenge" aria-describedby="fehler-plan-laenge">
            <p class="fehler" id="fehler-plan-laenge" hidden></p>
          </div>
          <div class="feld">
            <label for="plan-maschenProEreignis" data-text="plan.proEreignis">Maschen pro Zu-/Abnahme</label>
            <input id="plan-maschenProEreignis" type="text" inputmode="numeric" autocomplete="off" maxlength="6" data-planfeld="maschenProEreignis" data-regel="proEreignis" aria-describedby="fehler-plan-maschenProEreignis">
            <p class="fehler" id="fehler-plan-maschenProEreignis" hidden></p>
          </div>
        </div>
        <fieldset class="segment segment-zwei">
          <legend data-text="plan.arbeitsweise">Arbeitsweise</legend>
          <div class="segment-optionen">
            <label><input type="radio" name="plan-arbeitsweise" value="reihen"><span data-text="plan.reihen">In Reihen (gewendet)</span></label>
            <label><input type="radio" name="plan-arbeitsweise" value="runden"><span data-text="plan.runden">In Runden</span></label>
          </div>
        </fieldset>
        <div class="schalter-feld">
          <label class="schalter"><input type="checkbox" data-planfeld="jedeZweite" aria-describedby="plan-jedeZweite-hinweis"><span data-text="plan.jedeZweite">Nur jede 2. Reihe/Runde</span></label>
          <p class="feldhinweis" id="plan-jedeZweite-hinweis" data-text="plan.jedeZweiteHinweis">Dann nur in ungeraden Reihen bzw. Runden, ab Reihe 3.</p>
        </div>

        <div class="hinweis" data-rolle="probe-fehlt" hidden>
          <p data-text="plan.probeFehlt">Bitte zuerst die eigene Probe vollständig ausfüllen.</p>
          <a class="link" data-rolle="probe-link" href="#/" data-text="hinweis.probenLink">Zu den Maschenproben</a>
        </div>

        <div class="plan-werte" data-rolle="werte"></div>

        <fieldset class="plan-auswahl" data-rolle="auswahl" hidden>
          <legend data-rolle="auswahl-frage"></legend>
          <div class="optionen" data-rolle="optionen"></div>
        </fieldset>

        <div class="ergebnis plan-ergebnis">
          <p class="plan-zusammenfassung"><output data-rolle="zusammenfassung">–</output></p>
          <p class="visuell-versteckt" aria-live="polite" data-rolle="plan-ansage"></p>
          <p class="hinweis hinweis-warnung" data-rolle="status" hidden></p>
          <h3 class="visuell-versteckt" data-text="plan.listeTitel">Plan</h3>
          <ol class="plan-liste" data-rolle="liste"></ol>
        </div>

        <div class="knopf-reihe">
          <button type="button" class="knopf knopf-zweitrangig" data-rolle="anpassungen-zuruecksetzen" data-text="plan.anpassungenZuruecksetzen">Anpassungen zurücksetzen</button>
          <button type="button" class="knopf knopf-gefahr-rand" data-rolle="plan-loeschen" data-text="plan.loeschen">Plan löschen</button>
        </div>
      </div>
    </section>
  </template>

  <!-- Ein Ergebnis im Plan mit Anpassung (Anfangsmaschen, Endmaschen, Reihen gesamt) -->
  <template id="tpl-planwert">
    <div class="plan-wert">
      <p class="hauptergebnis"><span data-rolle="titel"></span> <output data-rolle="endgueltig">–</output></p>
      <p class="feldhinweis" data-rolle="info"></p>
      <div class="feld anpassung">
        <label data-rolle="anpassung-label"></label>
        <div class="stepper">
          <button type="button" class="stepper-knopf" data-schritt="-1" data-text-aria-label="anpassung.minus" aria-label="Anpassung um 1 verringern">−</button>
          <input type="text" inputmode="numeric" autocomplete="off" maxlength="6" data-rolle="anpassung">
          <button type="button" class="stepper-knopf" data-schritt="1" data-text-aria-label="anpassung.plus" aria-label="Anpassung um 1 erhöhen">+</button>
        </div>
        <p class="fehler" data-rolle="fehler" hidden></p>
      </div>
    </div>
  </template>

  <!-- Reihenzähler (US-11, US-15, US-30, US-33) -->
  <template id="tpl-zaehler">
    <div class="ansicht ansicht-zaehler">
      <p class="hinweis" data-rolle="wach-hinweis" hidden></p>
      <div class="zaehler-oben">
        <p class="zaehler-projekt" data-rolle="projektname"></p>
        <button type="button" class="knopf zaehler-minus" data-rolle="minus" data-text-aria-label="zaehler.minusLabel" aria-label="Eine Reihe zurück"><span aria-hidden="true" data-text="zaehler.minus">−1</span></button>
      </div>
      <section class="zaehler-ereignisse" data-rolle="ereignisse" aria-labelledby="titel-ereignisse" hidden>
        <h2 id="titel-ereignisse" class="visuell-versteckt" data-text="zaehler.ereignisse">Zu- und Abnahmen</h2>
        <dl class="ereignis-liste">
          <div><dt data-text="zaehler.letzte">Letzte</dt><dd data-ereignis="letzte">–</dd></div>
          <div><dt data-text="zaehler.naechste">Nächste</dt><dd data-ereignis="naechste">–</dd></div>
          <div><dt data-text="zaehler.uebernaechste">Übernächste</dt><dd data-ereignis="uebernaechste">–</dd></div>
        </dl>
      </section>
      <p class="zaehler-jetzt" data-rolle="jetzt" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 2 1 21h22L12 2zm1 15h-2v-2h2v2zm0-4h-2V9h2v4z"/></svg>
        <span data-rolle="jetzt-text"></span>
      </p>
      <div class="zaehler-mitte">
        <div class="zaehler-zeile">
          <label class="zaehler-feld" for="zaehler-wert">
            <span class="visuell-versteckt" data-text="zaehler.reiheEingeben">Reihe eingeben</span>
            <input id="zaehler-wert" class="zaehler-wert" type="text" inputmode="numeric" autocomplete="off" maxlength="6" aria-describedby="zaehler-von zaehler-fehler">
            <svg class="zaehler-stift" aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 0 0 0-1.41l-2.33-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.82-1.83z"/></svg>
          </label>
          <span class="zaehler-von" id="zaehler-von" data-rolle="von" hidden></span>
        </div>
        <p class="fehler" id="zaehler-fehler" hidden></p>
        <p class="zaehler-laenge" data-rolle="laenge" hidden></p>
        <p class="zaehler-ziel-erreicht" data-rolle="ziel-erreicht" hidden><span aria-hidden="true">✓ </span><span data-text="zaehler.zielErreicht">Ziel erreicht</span></p>
        <div class="zaehler-quelle" data-rolle="quelle" hidden>
          <label for="zaehler-quelle" data-text="zaehler.zielAus">Ziel aus</label>
          <select id="zaehler-quelle"></select>
        </div>
        <p class="visuell-versteckt" aria-live="polite" data-rolle="ansage"></p>
      </div>
      <button type="button" class="knopf zaehler-plus" data-rolle="plus" data-text-aria-label="zaehler.plusLabel" aria-label="Eine Reihe weiter"><span aria-hidden="true" data-text="zaehler.plus">+1</span></button>
      <button type="button" class="knopf knopf-zweitrangig zaehler-null" data-rolle="null" data-text="zaehler.null">Auf 0 setzen</button>
    </div>
  </template>

  <!-- Einstellungen (US-26, US-12) -->
  <template id="tpl-einstellungen">
    <div class="ansicht ansicht-einstellungen">
      <section class="karte">
        <fieldset class="segment" data-rolle="farbschema">
          <legend data-text="einst.farbschema">Farbschema</legend>
          <div class="segment-optionen">
            <label><input type="radio" name="farbschema" value="system"><span data-text="einst.system">Wie System</span></label>
            <label><input type="radio" name="farbschema" value="hell"><span data-text="einst.hell">Hell</span></label>
            <label><input type="radio" name="farbschema" value="dunkel"><span data-text="einst.dunkel">Dunkel</span></label>
          </div>
        </fieldset>
      </section>

      <section class="karte" aria-labelledby="titel-daten">
        <h2 id="titel-daten" data-text="einst.daten">Datensicherung</h2>
        <p data-text="einst.datenText">Deine Daten liegen nur auf diesem Gerät.</p>
        <p class="feldhinweis" data-text="einst.datenWarnung">Die Datei enthält alle deine Projekte.</p>
        <div class="knopf-reihe">
          <button type="button" class="knopf knopf-primaer" data-rolle="sichern" data-text="einst.sichern">Daten sichern</button>
          <label class="knopf knopf-zweitrangig datei-knopf">
            <span data-text="einst.einlesen">Sicherung einlesen</span>
            <input type="file" accept=".json,application/json" data-rolle="datei" class="visuell-versteckt">
          </label>
        </div>
        <p class="hinweis" data-rolle="status" role="status" hidden></p>
      </section>

      <p class="fuss-text" data-text="fuss.datenschutz">Alle Eingaben bleiben auf diesem Gerät.</p>
      <p class="fuss-text" data-rolle="version"></p>
    </div>
  </template>

  <!-- ===================================================== Dialoge ===================================================== -->

  <dialog id="dialog-bestaetigen" aria-labelledby="dialog-bestaetigen-titel" aria-describedby="dialog-bestaetigen-text">
    <h2 id="dialog-bestaetigen-titel" data-rolle="titel"></h2>
    <p id="dialog-bestaetigen-text" data-rolle="text"></p>
    <div class="dialog-knoepfe">
      <button type="button" class="knopf knopf-zweitrangig" data-rolle="abbrechen">Abbrechen</button>
      <button type="button" class="knopf knopf-primaer" data-rolle="ok">OK</button>
    </div>
  </dialog>

  <dialog id="dialog-name" aria-labelledby="dialog-name-titel">
    <h2 id="dialog-name-titel" data-rolle="titel"></h2>
    <div class="feld">
      <label for="dialog-name-eingabe">Name</label>
      <input id="dialog-name-eingabe" type="text" autocomplete="off" maxlength="80" enterkeyhint="done" aria-describedby="dialog-name-fehler">
      <p class="fehler" id="dialog-name-fehler" data-rolle="fehler" hidden></p>
    </div>
    <ul class="chips" data-rolle="vorschlaege" hidden></ul>
    <fieldset class="dialog-auswahl" data-rolle="auswahl" aria-describedby="dialog-name-auswahl-fehler" hidden>
      <legend>Auswahl</legend>
      <div class="optionen" data-rolle="optionen"></div>
      <p class="fehler" id="dialog-name-auswahl-fehler" data-rolle="auswahl-fehler" hidden></p>
    </fieldset>
    <div class="dialog-knoepfe">
      <button type="button" class="knopf knopf-zweitrangig" data-rolle="abbrechen">Abbrechen</button>
      <button type="button" class="knopf knopf-primaer" data-rolle="ok">OK</button>
    </div>
  </dialog>

  <dialog id="dialog-auswahl" aria-labelledby="dialog-auswahl-titel" aria-describedby="dialog-auswahl-text">
    <h2 id="dialog-auswahl-titel" data-rolle="titel"></h2>
    <p id="dialog-auswahl-text" data-rolle="text"></p>
    <fieldset class="dialog-auswahl" data-rolle="auswahl">
      <legend>Auswahl</legend>
      <div class="optionen" data-rolle="optionen"></div>
    </fieldset>
    <div class="dialog-knoepfe">
      <button type="button" class="knopf knopf-zweitrangig" data-rolle="abbrechen">Abbrechen</button>
      <button type="button" class="knopf knopf-primaer" data-rolle="ok">OK</button>
    </div>
  </dialog>
</body>
</html>
