name: Tests

on:
  push:
  pull_request:

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Keine Abhaengigkeiten: die Tests laufen allein mit node --test
      - run: node --test
